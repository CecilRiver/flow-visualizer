data_contracts:
  - id: "data.receiver_channel_samples"
    name: "接收机通道采样"
    description: "RC 接收链路提供的原始或已解码通道样本；具体协议和 HAL 表示留在外部边界。"
    fields:
      - name: "channels"
        type: "object"
        description: "Roll、Pitch、Throttle、Yaw 和模式开关等通道值。"
      - name: "new_input"
        type: "boolean"
        description: "本次读取是否获得了新输入。"
    evidence:
      - source_id: "source.code.read_radio"
        support: "direct"
        claim: "read_radio 使用 rc().read_input() 判断是否收到新 RC 输入。"

  - id: "data.pilot_control_input"
    name: "驾驶员控制输入"
    description: "RC 处理后供 Stabilize 使用的摇杆量、有效性与低油门状态。"
    fields:
      - name: "roll_norm"
        type: "number"
        description: "带死区处理的归一化 Roll 输入。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "pitch_norm"
        type: "number"
        description: "带死区处理的归一化 Pitch 输入。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "yaw_norm"
        type: "number"
        description: "带死区处理的归一化 Yaw 输入。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "throttle_control"
        type: "integer"
        description: "RC_Channel 产生的手动油门控制值。"
        unit: "control_in"
        range: { minimum: 0, maximum: 1000 }
      - name: "input_valid"
        type: "boolean"
        description: "当前 RC 输入是否有效。"
      - name: "throttle_zero"
        type: "boolean"
        description: "油门是否处于零输入状态。"
    evidence:
      - source_id: "source.code.read_radio"
        support: "direct"
        claim: "read_radio 更新 throttle failsafe、throttle_zero 和控制输入滤波状态。"
      - source_id: "source.code.pilot_lean"
        support: "direct"
        claim: "Roll/Pitch 使用 norm_input_dz 获取归一化输入。"
      - source_id: "source.code.pilot_yaw"
        support: "direct"
        claim: "Yaw 使用 norm_input_dz 获取归一化输入。"

  - id: "data.flight_mode_selection"
    name: "飞行模式选择"
    description: "去抖后的模式开关位置所解析出的 Copter 飞行模式请求。"
    fields:
      - name: "requested_mode"
        type: "enum"
        description: "请求的飞行模式。"
        values: ["STABILIZE"]
      - name: "reason"
        type: "enum"
        description: "模式请求来源。"
        values: ["RC_COMMAND"]
    evidence:
      - source_id: "source.code.mode_switch"
        support: "direct"
        claim: "模式开关位置映射到 flight_modes 参数并通过 RC_COMMAND 请求 set_mode。"

  - id: "data.mode_execution_tick"
    name: "当前模式执行触发"
    description: "主循环对当前 flightmode 的周期性 run 调用。"
    fields:
      - name: "active_mode"
        type: "enum"
        description: "被执行的当前模式。"
        values: ["STABILIZE"]
      - name: "loop_dt"
        type: "number"
        description: "当前控制循环时间步长。"
        unit: "s"
    evidence:
      - source_id: "source.code.mode_dispatch"
        support: "direct"
        claim: "update_flight_mode 调用 flightmode->run()。"

  - id: "data.imu_sample"
    name: "IMU 样本"
    description: "由传感器边界提供并由 INS/AHRS 更新消费的惯性测量样本集合。"
    fields:
      - name: "gyro"
        type: "vector3"
        description: "机体系三轴角速度测量。"
        unit: "rad/s"
        frame: "body"
      - name: "acceleration"
        type: "vector3"
        description: "机体系三轴加速度测量。"
        unit: "m/s^2"
        frame: "body"
    evidence:
      - source_id: "source.code.copter_scheduler"
        support: "contextual"
        claim: "调度表先更新 AP_InertialSensor，再运行速率控制和 AHRS。"

  - id: "data.attitude_rate_state"
    name: "姿态与角速度状态"
    description: "姿态控制闭环消费的机体到 NED 姿态和最新陀螺角速度。"
    fields:
      - name: "body_to_ned"
        type: "quaternion"
        description: "机体系到 NED 的姿态四元数。"
        frame: "body_to_ned"
      - name: "gyro_latest"
        type: "vector3"
        description: "最新机体系角速度。"
        unit: "rad/s"
        frame: "body"
    evidence:
      - source_id: "source.code.attitude_feedback"
        support: "direct"
        claim: "姿态控制从 AHRS 读取 body-to-NED 四元数并使用最新 gyro。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "多旋翼速率控制器从 AHRS 获取最新 gyro。"

  - id: "data.stabilize_target"
    name: "Stabilize 姿态与油门目标"
    description: "Stabilize 从驾驶员输入产生的 Roll/Pitch 角、Yaw 角速度和归一化油门目标。"
    fields:
      - name: "roll_target"
        type: "number"
        description: "目标滚转欧拉角。"
        unit: "rad"
        frame: "earth_euler"
      - name: "pitch_target"
        type: "number"
        description: "目标俯仰欧拉角。"
        unit: "rad"
        frame: "earth_euler"
      - name: "yaw_rate_target"
        type: "number"
        description: "目标偏航欧拉角速度。"
        unit: "rad/s"
        frame: "earth_euler"
      - name: "throttle_target"
        type: "number"
        description: "经过 hover-centered expo 变换的手动油门目标。"
        unit: "1"
        range: { minimum: 0.0, maximum: 1.0 }
    evidence:
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "ModeStabilize::run 计算 Roll/Pitch、Yaw rate 和 throttle 并提交给姿态控制器。"
      - source_id: "source.wiki.stabilize"
        support: "contextual"
        claim: "Wiki 描述 Roll/Pitch 控制倾角、Yaw 控制航向变化率、Throttle 控制平均电机速度。"

  - id: "data.spool_state_command"
    name: "电机 Spool 状态命令"
    description: "Stabilize 根据油门零状态请求的电机待机或不受启动过程限制状态。"
    fields:
      - name: "desired_spool_state"
        type: "enum"
        description: "请求的电机 spool 状态。"
        values: ["GROUND_IDLE", "THROTTLE_UNLIMITED"]
    evidence:
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "throttle_zero 决定 GROUND_IDLE 或 THROTTLE_UNLIMITED。"

  - id: "data.axis_throttle_demand"
    name: "轴控制量与油门需求"
    description: "姿态/角速度控制器写入 AP_Motors 的归一化 Roll、Pitch、Yaw 和 Throttle 需求。"
    fields:
      - name: "roll"
        type: "number"
        description: "滚转轴控制量。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "pitch"
        type: "number"
        description: "俯仰轴控制量。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "yaw"
        type: "number"
        description: "偏航轴控制量。"
        unit: "1"
        range: { minimum: -1.0, maximum: 1.0 }
      - name: "throttle"
        type: "number"
        description: "经过倾角补偿等处理后写入 AP_Motors 的油门。"
        unit: "1"
        range: { minimum: 0.0, maximum: 1.0 }
    evidence:
      - source_id: "source.code.motors_interface"
        support: "direct"
        claim: "AP_Motors 接口声明 Roll/Pitch/Yaw 为 -1..1、Throttle 为 0..1。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "角速度 PID 分别调用 set_roll、set_pitch 和 set_yaw。"
      - source_id: "source.code.throttle_output"
        support: "direct"
        claim: "姿态控制器调用 motors.set_throttle。"

  - id: "data.motor_limit_state"
    name: "电机控制饱和反馈"
    description: "AP_Motors 向控制器暴露的各轴和油门上下限饱和标志。"
    fields:
      - name: "roll_limited"
        type: "boolean"
        description: "滚转控制是否达到限制。"
      - name: "pitch_limited"
        type: "boolean"
        description: "俯仰控制是否达到限制。"
      - name: "yaw_limited"
        type: "boolean"
        description: "偏航控制是否达到限制。"
      - name: "throttle_lower_limited"
        type: "boolean"
        description: "油门是否达到下限。"
      - name: "throttle_upper_limited"
        type: "boolean"
        description: "油门是否达到上限。"
    evidence:
      - source_id: "source.code.motors_interface"
        support: "direct"
        claim: "AP_Motors_limit 定义 Roll、Pitch、Yaw 和油门上下限标志。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "角速度 PID 更新使用 motors.limit 对应轴标志。"

  - id: "data.per_motor_output"
    name: "逐电机输出命令"
    description: "Matrix 混控、补偿、限幅和 spool 逻辑后得到的逐电机执行量及 PWM 域命令。"
    fields:
      - name: "motor_index"
        type: "integer"
        description: "电机逻辑索引。"
      - name: "actuator"
        type: "number"
        description: "推力线性化后并经过 slew 限制的归一化执行量。"
        unit: "1"
        range: { minimum: 0.0, maximum: 1.0 }
      - name: "pwm_command"
        type: "integer"
        description: "传给 SRV 输出层的 PWM 域命令。"
        unit: "PWM count"
    evidence:
      - source_id: "source.code.matrix_mixing"
        support: "direct"
        claim: "Matrix 混控把 Roll/Pitch/Yaw/Throttle 需求组合为逐电机推力。"
      - source_id: "source.code.matrix_output"
        support: "direct"
        claim: "逐电机执行量经 output_to_pwm 后调用 rc_write。"

  - id: "data.actuator_signal"
    name: "执行器硬件信号"
    description: "SRV/HAL 输出层向 ESC 或电机执行机构发送的板级信号；协议细节在本模型边界之外。"
    fields:
      - name: "channel"
        type: "integer"
        description: "输出通道。"
      - name: "signal"
        type: "object"
        description: "PWM、DShot 或其他板级协议编码后的输出信号。"
    evidence:
      - source_id: "source.code.motor_channel_write"
        support: "direct"
        claim: "AP_Motors::rc_write 将电机函数和值写入 SRV_Channels。"
      - source_id: "source.code.motors_output_entry"
        support: "direct"
        claim: "Copter::motors_output 通过 srv.push 或 hal.rcout->push 推送输出。"

components:
  - id: "system.arducopter"
    name: "ArduCopter"
    level: 0
    scope: "internal"
    kind: "system"
    responsibility: "接收驾驶员和传感器输入，执行飞行模式与闭环控制，并产生飞行器执行输出。"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.wiki.flight_modes"
        support: "contextual"
