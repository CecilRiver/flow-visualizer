    responsibility: "把有效驾驶员输入转换为 Roll/Pitch 倾角、Yaw 速率、手动油门和电机 spool 目标。"
    ports:
      - id: "execution_tick"
        name: "模式执行触发"
        direction: "input"
        data_contract_id: "data.mode_execution_tick"
        required: true
      - id: "pilot_controls"
        name: "驾驶员控制输入"
        direction: "input"
