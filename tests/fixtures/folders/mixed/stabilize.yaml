      - "active_mode == STABILIZE"
      - "无有效 RC 输入时 Roll/Pitch 和 Yaw rate 目标回到零。"
      - "SHUT_DOWN 或 GROUND_IDLE 状态下油门目标被置零并重置控制器状态。"
    implementation:
