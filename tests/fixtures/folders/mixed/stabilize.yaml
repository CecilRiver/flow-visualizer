schema_version: "0.1"

model:
  id: "arducopter.stabilize.v0_1"
  title: "ArduCopter Stabilize L0-L2 业务流程"
  description: "多旋翼 Matrix 机架下，驾驶员 RC 输入经 Stabilize、姿态/角速度控制和电机混控到执行器输出的证据化业务数据流。"
  vehicle: "ArduCopter"
  source_revision: "63ac2d68f2296252d1aeda58a10c219da7edcc7b"
  generated_on: "2026-09-22"
  language: "zh-CN"
  review_status: "evidence_checked"
  scope:
    levels: [0, 1, 2]
    frame_profile: "multirotor_matrix"
    includes:
      - "Stabilize 模式的正常稳态控制路径"
      - "RC 输入、飞行模式分派、姿态状态估计、姿态/角速度控制、电机混控和执行器输出"
      - "电机饱和限制对角速度 PID 的反馈"
    excludes:
      - "传统直升机、Single、Coax、Tailsitter 等不同输出实现"
      - "Radio/EKF Failsafe 的动作决策；它属于后续 Failsafe 场景"
      - "具体接收机协议、IMU 驱动、HAL 和板级执行器驱动"
      - "函数级 L3 节点和语句级调用图"
    assumptions:
      - "当前飞行模式已经成功切换为 STABILIZE。"
      - "使用 AP_MotorsMatrix 类多旋翼机架实现作为混控证据。"
      - "数据流表示稳态语义依赖，不表示同一次主循环内严格从左到右执行。"
      - "速率控制和电机输出会为降低陀螺采样延迟而在调度表中先于姿态目标更新执行。"

