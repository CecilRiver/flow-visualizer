      - source_id: "source.code.motor_channel_write"
        role: "primary"
      - source_id: "source.code.motors_output_entry"
        role: "boundary"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.code.motor_channel_write"
        support: "direct"
        claim: "rc_write 将输出写入对应 SRV 电机功能。"
      - source_id: "source.code.motors_output_entry"
        support: "direct"
        claim: "Copter 输出入口最终调用 srv.push 或 hal.rcout->push。"
    tags: ["output", "srv_channels", "hal_boundary"]

flows:
  - id: "flow.pilot_to_rc"
    name: "驾驶员通道输入"
    kind: "command"
    from: { component_id: "external.pilot_rc", port_id: "receiver_signal" }
    to: { component_id: "input.rc_processing", port_id: "receiver_signal" }
    data_contract_id: "data.receiver_channel_samples"
    transport: "hardware_io"
    cadence:
      kind: "periodic"
      rate_hz: 250
      constraint: "调度表以 250 Hz 调用 rc_loop；read_input 仅在有新样本时返回 true。"
    transform: "接收机/HAL 解码结果进入 RC_Channels；具体无线协议不在模型范围内。"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.copter_scheduler"
        support: "direct"
        claim: "scheduler_tasks 以 250 Hz 调用 rc_loop。"
      - source_id: "source.code.read_radio"
        support: "direct"
        claim: "read_radio 调用 rc().read_input()。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.rc_to_mode_dispatch"
    name: "RC 模式开关选择"
    kind: "event"
    from: { component_id: "input.rc_processing", port_id: "mode_selection" }
    to: { component_id: "mode.flight_mode_dispatch", port_id: "mode_selection" }
    data_contract_id: "data.flight_mode_selection"
    transport: "direct_call"
    cadence:
      kind: "on_change"
      constraint: "模式开关位置经去抖确认后触发。"
    transform: "模式开关位置映射到 FLTMODE 参数并发出 RC_COMMAND 模式请求。"
    conditions:
      - "RC input is valid"
      - "requested mode is STABILIZE"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.rc_loop"
        support: "direct"
        claim: "rc_loop 调用 read_mode_switch。"
      - source_id: "source.code.mode_switch"
        support: "direct"
        claim: "mode_switch_changed 调用 copter.set_mode。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.mode_dispatch_to_stabilize"
    name: "执行 Stabilize 模式"
    kind: "event"
    from: { component_id: "mode.flight_mode_dispatch", port_id: "execution_tick" }
    to: { component_id: "mode.stabilize", port_id: "execution_tick" }
    data_contract_id: "data.mode_execution_tick"
    transport: "virtual_call"
    cadence:
      kind: "periodic"
      constraint: "FAST_TASK 主循环速率；update_flight_mode 注释要求 100 Hz 或更高。"
    transform: "flightmode 指针的虚调用分派到 ModeStabilize::run。"
    conditions:
      - "active_mode == STABILIZE"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.mode_dispatch"
        support: "direct"
        claim: "update_flight_mode 调用 flightmode->run()。"
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "ModeStabilize 实现当前模式的 run 行为。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.rc_to_stabilize"
    name: "Stabilize 消费驾驶员控制输入"
    kind: "command"
    from: { component_id: "input.rc_processing", port_id: "pilot_controls" }
    to: { component_id: "mode.stabilize", port_id: "pilot_controls" }
    data_contract_id: "data.pilot_control_input"
    transport: "shared_state"
    cadence:
      kind: "periodic"
      constraint: "每次 ModeStabilize::run 消费最近一次有效 RC_Channel 状态。"
    transform: "通过 norm_input_dz、有效性和 throttle_zero 等共享状态提供模式输入。"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.pilot_lean"
        support: "direct"
        claim: "Stabilize 辅助函数读取 channel_roll 和 channel_pitch。"
      - source_id: "source.code.pilot_yaw"
        support: "direct"
        claim: "Yaw 辅助函数读取 channel_yaw。"
      - source_id: "source.code.pilot_throttle"
        support: "direct"
        claim: "Throttle 辅助函数读取 channel_throttle。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.sensors_to_estimation"
    name: "惯性测量进入状态估计"
    kind: "measurement"
    from: { component_id: "external.vehicle_sensors", port_id: "imu_sample" }
    to: { component_id: "estimation.attitude", port_id: "imu_sample" }
    data_contract_id: "data.imu_sample"
    transport: "hardware_io"
    cadence:
      kind: "periodic"
      constraint: "AP_InertialSensor 在 FAST_TASK 中更新，AHRS 随后在主循环更新。"
    transform: "板级传感器采样经 AP_InertialSensor 暴露给 AHRS；驱动细节不在本模型范围。"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.copter_scheduler"
        support: "direct"
        claim: "调度表先运行 AP_InertialSensor::update，再运行 read_AHRS。"
      - source_id: "source.code.ahrs_update"
        support: "direct"
        claim: "read_AHRS 调用 ahrs.update(true)。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.estimation_to_attitude_control"
    name: "姿态与角速度反馈"
    kind: "feedback"
    from: { component_id: "estimation.attitude", port_id: "attitude_rate_state" }
    to: { component_id: "control.attitude_rate", port_id: "attitude_rate_state" }
    data_contract_id: "data.attitude_rate_state"
    transport: "shared_state"
    cadence:
      kind: "periodic"
      constraint: "姿态控制和角速度控制读取当前 AHRS/gyro 状态。"
    transform: "AHRS 提供 body-to-NED 姿态，最新 gyro 作为角速度 PID 测量。"
    feedback: true
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.attitude_feedback"
        support: "direct"
        claim: "attitude_controller_run_quat 读取 AHRS 姿态和 gyro。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "rate_controller_run 读取 ahrs.get_gyro_latest。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.stabilize_to_attitude_control"
    name: "Stabilize 姿态与油门目标"
    kind: "command"
    from: { component_id: "mode.stabilize", port_id: "stabilize_target" }
    to: { component_id: "control.attitude_rate", port_id: "stabilize_target" }
    data_contract_id: "data.stabilize_target"
    transport: "direct_call"
    cadence:
      kind: "periodic"
      constraint: "每次 ModeStabilize::run 更新目标。"
    transform: "Roll/Pitch 摇杆转换为受倾角限制的欧拉角；Yaw 转换为速率；Throttle 经 hover-centered expo 转换并启用倾角补偿。"
    conditions:
      - "active_mode == STABILIZE"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "调用 attitude input 和 set_throttle_out 提交目标。"
      - source_id: "source.code.attitude_input"
        support: "direct"
        claim: "姿态控制器接收 Roll/Pitch 角和 Yaw rate。"
      - source_id: "source.wiki.stabilize"
        support: "contextual"
        claim: "Wiki 对三个姿态轴和油门的业务语义与源码一致。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.stabilize_to_motor_mixer_spool"
    name: "Stabilize 电机 Spool 请求"
    kind: "command"
    from: { component_id: "mode.stabilize", port_id: "spool_command" }
    to: { component_id: "actuation.motor_mixer", port_id: "spool_command" }
    data_contract_id: "data.spool_state_command"
    transport: "direct_setter"
    cadence:
      kind: "periodic"
      constraint: "每次 ModeStabilize::run 根据 throttle_zero 更新。"
    transform: "零油门请求 GROUND_IDLE，否则请求 THROTTLE_UNLIMITED；未解锁时 setter 仍强制 SHUT_DOWN。"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "ModeStabilize::run 调用 motors->set_desired_spool_state。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.attitude_control_to_motor_mixer"
    name: "姿态控制量写入电机混控"
    kind: "control"
    from: { component_id: "control.attitude_rate", port_id: "axis_throttle_demand" }
    to: { component_id: "actuation.motor_mixer", port_id: "axis_throttle_demand" }
    data_contract_id: "data.axis_throttle_demand"
    transport: "direct_setter"
    cadence:
      kind: "periodic"
      constraint: "角速度控制在 FAST_TASK 或专用 rate thread 中运行；油门目标由模式更新。"
    transform: "角速度 PID 生成 Roll/Pitch/Yaw 归一化控制量；手动油门经倾角补偿后写入 AP_Motors。"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "角速度 PID 调用 motors.set_roll/pitch/yaw。"
      - source_id: "source.code.throttle_output"
        support: "direct"
        claim: "set_throttle_out 调用 motors.set_throttle。"
      - source_id: "source.code.motors_interface"
        support: "direct"
        claim: "AP_Motors 定义轴控制量和油门的范围。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.motor_mixer_limit_feedback"
    name: "混控饱和限制反馈"
    kind: "feedback"
    from: { component_id: "actuation.motor_mixer", port_id: "motor_limits" }
    to: { component_id: "control.attitude_rate", port_id: "motor_limits" }
    data_contract_id: "data.motor_limit_state"
    transport: "shared_state"
    cadence:
      kind: "periodic"
      constraint: "角速度 PID 每次更新读取上一混控结果的限制标志。"
    transform: "混控输出饱和状态用于各轴 PID 的抗积分饱和处理。"
    feedback: true
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.motors_interface"
        support: "direct"
        claim: "AP_Motors 暴露 limit.roll/pitch/yaw/throttle 标志。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "PID update_all 使用对应的 motors.limit 轴标志。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.motor_mixer_to_output_adapter"
    name: "混控结果转换为逐电机输出"
    kind: "actuation"
    from: { component_id: "actuation.motor_mixer", port_id: "per_motor_output" }
    to: { component_id: "actuation.output_adapter", port_id: "per_motor_output" }
    data_contract_id: "data.per_motor_output"
    transport: "internal_state"
    cadence:
      kind: "periodic"
      constraint: "Copter 电机输出 FAST_TASK 或专用 rate thread。"
    transform: "Matrix 控制分配、补偿、限幅、推力线性化和 slew 限制生成逐电机 PWM 域命令。"
    conditions:
      - "frame implementation is AP_MotorsMatrix"
    verification: "code_confirmed"
    evidence:
      - source_id: "source.code.multicopter_output"
        support: "direct"
        claim: "output 依次运行 spool、混控、补偿和 output_to_motors。"
      - source_id: "source.code.matrix_mixing"
        support: "direct"
        claim: "output_armed_stabilizing 执行 Matrix 控制分配。"
      - source_id: "source.code.matrix_output"
        support: "direct"
        claim: "output_to_motors 生成 actuator 和 PWM 域输出。"
    scenario_ids: ["scenario.stabilize_manual_control"]

  - id: "flow.output_adapter_to_actuators"
    name: "执行器通道输出"
    kind: "actuation"
    from: { component_id: "actuation.output_adapter", port_id: "actuator_signal" }
    to: { component_id: "external.motor_actuators", port_id: "actuator_signal" }
    data_contract_id: "data.actuator_signal"
    transport: "hardware_io"
    cadence:
      kind: "periodic"
      constraint: "主循环或 rate thread 输出；具体协议频率由板级与电机配置决定。"
    transform: "SRV_Channels 将逻辑电机功能映射到输出通道，随后由 SRV/HAL push 发送。"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.code.motor_channel_write"
        support: "direct"
        claim: "rc_write 调用 SRV_Channels 设置电机通道输出。"
      - source_id: "source.code.motors_output_entry"
        support: "direct"
        claim: "motors_output 调用 srv.push 或 hal.rcout->push。"
      - source_id: "source.wiki.attitude_control"
        support: "contextual"
        claim: "开发文档描述 AP_Motors 输出最终通过 HAL 出现在板级输出端。"
    scenario_ids: ["scenario.stabilize_manual_control"]

scenarios:
  - id: "scenario.stabilize_manual_control"
    name: "Stabilize 手动姿态控制"
    description: "驾驶员通过 RC 直接控制 Roll/Pitch 倾角、Yaw 变化率和油门，姿态/角速度闭环维持目标并驱动 Matrix 多旋翼电机。"
    default_level: 2
    entry_conditions:
      - "当前或请求的飞行模式为 STABILIZE。"
      - "配置使用多旋翼 AP_MotorsMatrix 输出实现。"
      - "正常控制路径中 RC 输入有效；无效输入的目标归零行为保留为组件条件。"
    exit_conditions:
      - "切换到其他飞行模式。"
      - "解除武装或安全逻辑使电机进入 SHUT_DOWN；完整安全流程由 Failsafe 场景建模。"
    component_ids:
      - "system.arducopter"
      - "external.pilot_rc"
      - "external.vehicle_sensors"
      - "external.motor_actuators"
      - "domain.input_commands"
      - "domain.flight_mode_mission"
      - "domain.state_estimation"
      - "domain.flight_control"
      - "domain.actuation"
      - "input.rc_processing"
      - "mode.flight_mode_dispatch"
      - "mode.stabilize"
      - "estimation.attitude"
      - "control.attitude_rate"
      - "actuation.motor_mixer"
      - "actuation.output_adapter"
    flow_ids:
      - "flow.pilot_to_rc"
      - "flow.rc_to_mode_dispatch"
      - "flow.mode_dispatch_to_stabilize"
      - "flow.rc_to_stabilize"
      - "flow.sensors_to_estimation"
      - "flow.estimation_to_attitude_control"
      - "flow.stabilize_to_attitude_control"
      - "flow.stabilize_to_motor_mixer_spool"
      - "flow.attitude_control_to_motor_mixer"
      - "flow.motor_mixer_limit_feedback"
      - "flow.motor_mixer_to_output_adapter"
      - "flow.output_adapter_to_actuators"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.wiki.stabilize"
        support: "direct"
        claim: "Wiki 定义 Stabilize 的手动倾角、Yaw rate、油门和自稳业务行为。"
      - source_id: "source.code.stabilize_run"
        support: "direct"
        claim: "源码实现驾驶员输入到姿态控制和电机 spool 的模式行为。"
      - source_id: "source.wiki.attitude_control"
        support: "contextual"
        claim: "开发文档给出飞行模式、姿态控制、AP_Motors 和 HAL 的总体路径。"
    notes:
      - "该图是闭环稳态数据依赖图，不是单次循环的严格时序图。"
      - "Copter 调度表先运行 rate controller 和 motors output，再更新 AHRS 和 flight mode；这是降低 gyro 延迟的设计。"
      - "Stabilize 不使用 AC_PosControl，也不要求位置估计，因此第一场景不包含导航和位置控制域。"
      - "Radio/EKF Failsafe 的检测、动作策略和模式切换将在独立场景中补充。"
