        data_contract_id: "data.motor_limit_state"
        required: true
      - id: "per_motor_output"
        name: "逐电机输出"
        direction: "output"
        data_contract_id: "data.per_motor_output"
        required: true
    conditions:
      - "frame implementation is AP_MotorsMatrix"
      - "输出受 armed、interlock 和 spool_state 等状态约束。"
    implementation:
      - source_id: "source.code.motors_interface"
        role: "supporting"
      - source_id: "source.code.multicopter_output"
        role: "primary"
      - source_id: "source.code.matrix_mixing"
        role: "primary"
      - source_id: "source.code.matrix_output"
        role: "supporting"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.code.matrix_mixing"
        support: "direct"
        claim: "Matrix 实现读取 Roll/Pitch/Yaw/Throttle 并进行控制分配和限幅。"
      - source_id: "source.wiki.attitude_control"
        support: "contextual"
        claim: "开发文档将 AP_Motors 定义为把轴控制量和油门转换为绝对电机输出的混控组件。"
    tags: ["motors", "mixer", "allocation", "limits"]

  - id: "actuation.output_adapter"
    name: "执行器输出适配"
    level: 2
    scope: "internal"
    kind: "output_adapter"
    parent_id: "domain.actuation"
    responsibility: "把逐电机执行量转换并写入 SRV/HAL 输出通道，形成外部 ESC 或电机可消费的板级信号。"
    ports:
      - id: "per_motor_output"
        name: "逐电机输出"
        direction: "input"
        data_contract_id: "data.per_motor_output"
        required: true
      - id: "actuator_signal"
        name: "执行器硬件信号"
        direction: "output"
