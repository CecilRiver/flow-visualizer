        support: "direct"
        claim: "源码直接计算并提交姿态、偏航速率、油门和 spool 目标。"
      - source_id: "source.wiki.stabilize"
        support: "contextual"
        claim: "Wiki 描述 Stabilize 为手动飞行并自动水平 Roll/Pitch。"
    tags: ["mode", "manual_control", "stabilize"]

  - id: "estimation.attitude"
    name: "姿态与角速度估计"
    level: 2
