        required: true
      - id: "motor_limits"
        name: "电机饱和限制反馈"
        direction: "input"
        data_contract_id: "data.motor_limit_state"
        required: true
      - id: "axis_throttle_demand"
        name: "轴控制量与油门需求"
        direction: "output"
        data_contract_id: "data.axis_throttle_demand"
        required: true
    implementation:
      - source_id: "source.code.attitude_input"
        role: "primary"
      - source_id: "source.code.attitude_feedback"
        role: "primary"
      - source_id: "source.code.rate_controller"
        role: "primary"
      - source_id: "source.code.throttle_output"
        role: "supporting"
    verification: "docs_and_code_confirmed"
    evidence:
      - source_id: "source.code.attitude_feedback"
        support: "direct"
        claim: "姿态误差被转换为机体系角速度目标。"
      - source_id: "source.code.rate_controller"
        support: "direct"
        claim: "角速度 PID 使用 gyro 反馈并写入 AP_Motors 轴控制量。"
      - source_id: "source.wiki.attitude_control"
        support: "contextual"
        claim: "开发文档描述角度误差到期望角速度，再到电机控制量的级联控制。"
    tags: ["attitude", "rate", "pid", "controller"]

  - id: "actuation.motor_mixer"
    name: "电机混控与限制"
    level: 2
    scope: "internal"
    kind: "mixer"
    parent_id: "domain.actuation"
    responsibility: "应用 spool 逻辑、补偿和控制分配，把 Roll/Pitch/Yaw/Throttle 需求转换为 Matrix 机架逐电机输出，并产生饱和限制反馈。"
    ports:
      - id: "axis_throttle_demand"
        name: "轴控制量与油门需求"
        direction: "input"
